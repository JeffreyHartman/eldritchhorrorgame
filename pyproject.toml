[project]
name = "eldritch-pursuit"
version = "0.2.0"
description = "A co-op cosmic-horror board game for the terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rich>=13.7"]

[project.scripts]
eldritch-pursuit = "pursuit.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pursuit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not soak\""
markers = ["soak: long full-game runs with bots"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
files = ["src/pursuit", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
